name: Natural Contribution Engine

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  contribute:
    runs-on: ubuntu-latest

    steps:
      - name: Repo'yu çek
        uses: actions/checkout@v4

      - name: Şanslı saat mi? (Dice Roll)
        if: github.event_name == 'schedule'
        run: |
          CHANCE=$((RANDOM % 100))
          echo "Zar sonucu: $CHANCE (Gerekli: < 8)"
          if [ $CHANCE -ge 8 ]; then
            echo "💤 Bu saat pas geçildi. Uyumaya devam."
            exit 0
          fi
          echo "🎉 Şanslı saat! Çalışmaya başlıyoruz."

      - name: Python kütüphanelerini kur
        run: pip install requests

      - name: Repo seç
        run: python scripts/pick_repo.py

      - name: Hedef repo clone
        run: |
          REPO=$(cat selected_repo.txt)
          echo "Seçilen repo: $REPO"
          git clone https://x-access-token:${{ secrets.PERSONAL_TOKEN }}@github.com/$REPO target

      - name: Commit sayısını belirle
        run: |
          COMMITS=$((2 + RANDOM % 11))
          echo "Bu seansta $COMMITS adet commit atılacak."
          echo "COMMITS=$COMMITS" >> $GITHUB_ENV

      - name: Commit loop
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cd target
          
          git config user.name "beserion"
          git config user.email "hyk41hyk@gmail.com"

          for i in $(seq 1 $COMMITS); do
            echo "--- İşleniyor: $i / $COMMITS ---"
            
            python ../scripts/make_change.py

            python ../scripts/ai_commit_message.py || echo "⚠️ AI hata verdi, devam ediliyor."

            # Commit işlemi
            git add .
            
            if [ -f "../commit_msg.txt" ]; then
              MSG=$(cat ../commit_msg.txt)
            else
              MSG="chore: update"
            fi
            
            git commit -m "$MSG"
            
            sleep $((2 + RANDOM % 9))
          done

          echo "Pushlanıyor..."
          REPO=$(cat ../selected_repo.txt)
          git push https://x-access-token:${{ secrets.PERSONAL_TOKEN }}@github.com/$REPO
